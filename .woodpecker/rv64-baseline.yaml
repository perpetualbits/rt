# Baseline conformance on riscv64.
#
# milkv is in-order with NO vector extension (isa rv64imafdc). It is the only
# machine in the fleet that catches vector codegen leaking into code that is
# supposed to run everywhere, which is why it gets its own workflow rather than
# competing for generic riscv64 work.
#
# Scoped to the engine crates on purpose. The `rt` BINARY is a Wayland/EGL
# application and milkv is a slow X11-only board that will never display it —
# proving the GUI links there costs a large dependency install and tells us
# nothing. What matters is that the portable parsing/terminal code builds and
# passes on baseline silicon.
#
# rt-engine IS such portable code and belongs here despite the name: it depends
# only on the vendored engine, libc, vt-term and rt-handoff (no Wayland/EGL), and
# it owns the PTY read loop. Omitting it cost us real coverage — the 2026-09-03
# dead-child output-loss bug lived in that loop and reproduced ONLY on riscv64,
# so no cell in the fleet could have caught it. crates/rt-engine/tests/exit_race.rs
# is the regression test, and this is the only arch where it is meaningful.
#
# Advisory on push: a full build here takes minutes and must not gate the inner
# loop. It becomes blocking in the tag pipeline (Stage 4).

when:
  - event: [push, pull_request, manual]

labels:
  board: milkv

variables:
  - &rust
    CARGO_HOME: /var/cache/forge-ci/cargo
    CARGO_TARGET_DIR: /var/cache/forge-ci/target
    RUSTUP_HOME: /var/lib/woodpecker/.rustup
    PATH: /var/lib/woodpecker/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

steps:
  - name: verify-arch
    image: bash
    environment: *rust
    # If a label is ever misconfigured and this lands on x86_64, fail loudly
    # rather than quietly pass and give false confidence in riscv64 coverage.
    commands:
      - test "$(uname -m)" = "riscv64" || { echo "wrong arch"; uname -m; exit 1; }
      - grep -m1 isa /proc/cpuinfo

  - name: disk
    image: bash
    environment: *rust
    # milkv has filled its disk twice (2026-09-02, 2026-09-03). cargo reports that
    # only as a distant `exit status: 101` under a wall of rustc command lines, so
    # print the state up front and make the real cause a one-line read. Never
    # blocking: this is a report, not a gate.
    failure: ignore
    commands:
      - df -h / /var/cache/forge-ci /tmp 2>/dev/null || df -h
      - du -sh /var/cache/forge-ci/target /var/cache/forge-ci/cargo 2>/dev/null || true
      - du -sh /var/cache/forge-ci/target/* 2>/dev/null | sort -h | tail -5 || true
      # The CI cache is only ~1.2G of a 15G disk, so when this board fills up the
      # cause is somewhere else entirely. Show the whole root filesystem: -x keeps
      # it on one device so it cannot wander into /proc or a mount.
      - du -xh --max-depth=1 / 2>/dev/null | sort -h | tail -12 || true
      - du -xh --max-depth=2 /var 2>/dev/null | sort -h | tail -8 || true

  - name: build-and-test
    image: bash
    environment: *rust
    failure: ignore
    # No -C target-cpu=native anywhere: a natively tuned binary would SIGILL on
    # exactly the baseline hardware this cell exists to protect.
    commands:
      - cargo build --release -p vt-parser -p vt-term -p rt-core -p rt-config -p rt-engine
      - cargo test -p vt-parser -p vt-term -p rt-core -p rt-config -p rt-engine
